<style>
:root{
  --night:#070A18;
  --night-2:#0B1026;
  --ink:#121A3E;
  --glass:rgba(18,26,62,.55);
  --line:rgba(244,238,226,.10);
  --gold:#E8BB6B;
  --cyan:#7DE6FF;
  --violet:#9D7BFF;
  --rose:#FF9ECF;
  --paper:#F4EEE2;
  --mist:#9AA1C7;
  --display:'Fraunces',Georgia,serif;
  --body:'Albert Sans',system-ui,sans-serif;
  --tech:'Space Grotesk',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--night);
  color:var(--paper);
  font-family:var(--body);
  font-size:17px;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--night)}
a{color:inherit; text-decoration:none;}

/* ---------- aurora nebula layer ---------- */
.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(110px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:55vw;height:55vw;left:-10%;top:-12%;background:radial-gradient(circle,rgba(157,123,255,.5),transparent 65%);animation:auro1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:48vw;height:48vw;right:-8%;top:18%;background:radial-gradient(circle,rgba(125,230,255,.34),transparent 65%);animation:auro2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:60vw;height:60vw;left:22%;bottom:-22%;background:radial-gradient(circle,rgba(232,187,107,.3),transparent 65%);animation:auro3 38s ease-in-out infinite alternate}
@keyframes auro1{to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes auro2{to{transform:translate(-8vw,10vh) scale(.9)}}
@keyframes auro3{to{transform:translate(-6vw,-9vh) scale(1.12)}}

body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;
  background:
    linear-gradient(rgba(244,238,226,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(244,238,226,.5) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 75%);
}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{position:relative;z-index:1}

/* ---------- nav ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px clamp(20px,5vw,64px);
  transition:background .4s,border-color .4s,padding .4s;
  border-bottom:1px solid transparent;
}
nav.scrolled{
  background:rgba(7,10,24,.7);backdrop-filter:blur(18px);
  border-bottom-color:var(--line);padding-top:13px;padding-bottom:13px;
}
.brand{font-family:var(--display);font-weight:500;font-size:21px;text-decoration:none}
.brand em{font-style:italic;background:linear-gradient(100deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a{
  text-decoration:none;font-family:var(--tech);font-size:12.5px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mist);transition:color .25s;
}
.nav-links a:hover{color:var(--cyan)}
.nav-amzn{
  color:var(--night)!important;background:linear-gradient(110deg,var(--gold),#F2D49B);
  padding:10px 18px;border-radius:100px;letter-spacing:.1em!important;
  transition:transform .25s,box-shadow .25s!important;
}
.nav-amzn:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(232,187,107,.5);color:var(--night)!important}
@media(max-width:640px){.nav-links a:not(.nav-amzn){display:none}}

/* ---------- hero ---------- */
.hero{
  min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:120px 24px 80px;position:relative;
}
.eyebrow{
  font-family:var(--tech);font-size:12px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;
  color:var(--cyan);margin-bottom:28px;display:inline-flex;align-items:center;gap:14px;
}
.eyebrow::before,.eyebrow::after{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}
.eyebrow::after{background:linear-gradient(90deg,var(--cyan),transparent)}
h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(54px,11vw,124px);line-height:1.02;letter-spacing:-.015em;
  background:linear-gradient(115deg,var(--paper) 25%,var(--gold) 48%,var(--rose) 64%,var(--cyan) 82%,var(--paper) 100%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 9s linear infinite;
}
@keyframes sheen{to{background-position:220% center}}
.hero-sub{max-width:540px;margin:30px auto 0;color:var(--mist);font-size:clamp(16px,2vw,19px)}
.hero-cta{display:flex;gap:16px;margin-top:44px;flex-wrap:wrap;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;
  font-family:var(--tech);font-weight:700;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:17px 34px;border-radius:100px;border:none;
  transition:transform .25s,box-shadow .25s,background .25s,color .25s;
}
.btn-gold{background:linear-gradient(110deg,var(--gold),#F2D49B);color:var(--night)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 0 38px rgba(232,187,107,.55),0 12px 34px rgba(0,0,0,.4)}
.btn-ghost{
  border:1px solid rgba(125,230,255,.35);color:var(--cyan);background:rgba(125,230,255,.05);
  backdrop-filter:blur(8px);
}
.btn-ghost:hover{border-color:var(--cyan);box-shadow:0 0 26px rgba(125,230,255,.3);transform:translateY(-2px)}
.scroll-hint{
  position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
  color:var(--mist);font-family:var(--tech);font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;
  animation:drift 2.6s ease-in-out infinite;
}
@keyframes drift{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

/* ---------- sections ---------- */
section{padding:clamp(80px,12vw,150px) clamp(20px,6vw,72px);max-width:1240px;margin:0 auto}
.sec-head{margin-bottom:clamp(44px,6vw,72px)}
.sec-eyebrow{
  font-family:var(--tech);font-size:11.5px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
  color:var(--cyan);display:block;margin-bottom:16px;
}
h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.4vw,58px);line-height:1.08;letter-spacing:-.01em}
h2 em{
  font-style:italic;font-weight:300;
  background:linear-gradient(100deg,var(--violet),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ---------- bookshelf ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr));gap:clamp(22px,3vw,36px)}
.shelf-status{color:var(--mist); font-size:15px; grid-column:1/-1;}

.book-card {
  background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:24px; padding:24px; display:flex; gap:20px; align-items:flex-start;
  border: 1px solid var(--line); transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.book-card:hover { transform: translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.3); }
.book-cover-wrapper { width:110px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,0.4); background:rgba(255,255,255,0.03); }
.book-cover-wrapper img { width:100%; height:100%; object-fit:cover; }
.gen-cover { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:hsl(var(--accent-hue, 215), 40%, 20%); font-family:var(--display); font-size:11px; padding:10px; text-align:center; }
.book-details { flex:1; display:flex; flex-direction:column; gap:6px; }
.tag { font-family:var(--tech); font-size:10px; font-weight:700; color:var(--cyan); letter-spacing:0.15em; text-transform:uppercase; }
.book-details h3 { font-family:var(--display); font-size:22px; font-weight:400; color:var(--paper); }
.book-details .subtitle { font-size:14px; font-style:italic; color:var(--gold); line-height:1.3; }
