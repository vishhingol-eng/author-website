<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Article — Vishal Hingol</title>
<meta name="description" id="pageDesc" content="">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Vishal Hingol — Author">
<meta id="ogTitle" property="og:title" content="">
<meta id="ogDesc" property="og:description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Albert+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#070A18;--night-2:#0B1026;--ink:#121A3E;
  --glass:rgba(18,26,62,.55);--line:rgba(244,238,226,.10);
  --gold:#E8BB6B;--cyan:#7DE6FF;--violet:#9D7BFF;--rose:#FF9ECF;
  --paper:#F4EEE2;--mist:#9AA1C7;
  --display:'Fraunces',Georgia,serif;
  --body:'Albert Sans',system-ui,sans-serif;
  --tech:'Space Grotesk',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:var(--night)}

.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(110px);opacity:.35}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:50vw;height:50vw;left:-10%;top:-10%;background:radial-gradient(circle,rgba(157,123,255,.4),transparent 65%);animation:a1 28s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:44vw;height:44vw;right:-8%;top:25%;background:radial-gradient(circle,rgba(125,230,255,.25),transparent 65%);animation:a2 34s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:55vw;height:55vw;left:20%;bottom:-20%;background:radial-gradient(circle,rgba(232,187,107,.22),transparent 65%);animation:a3 40s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(8vw,6vh) scale(1.12)}}
@keyframes a2{to{transform:translate(-7vw,9vh) scale(.9)}}
@keyframes a3{to{transform:translate(-5vw,-8vh) scale(1.1)}}

nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,60px);background:rgba(7,10,24,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:19px;font-weight:500}
.brand em{font-style:italic;background:linear-gradient(100deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-family:var(--tech);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);transition:color .2s}
.nav-links a:hover{color:var(--cyan)}
.nav-amzn{color:var(--night)!important;background:linear-gradient(110deg,var(--gold),#F2D49B);padding:9px 16px;border-radius:100px;letter-spacing:.08em!important}
@media(max-width:600px){.nav-links a:not(.nav-amzn){display:none}}

/* article layout */
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:clamp(44px,6vw,80px) clamp(18px,4vw,40px) 100px}

.art-meta{margin-bottom:34px}
.art-cat{font-family:var(--tech);font-size:11px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);display:block;margin-bottom:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5.5vw,52px);line-height:1.08;letter-spacing:-.015em;margin-bottom:18px}
.art-byline{display:flex;align-items:center;gap:16px;color:var(--mist);font-size:13.5px;font-family:var(--tech);flex-wrap:wrap}
.art-byline strong{color:var(--gold)}
.art-divider{width:60px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:30px 0}

/* article body */
.art-body{font-size:clamp(16px,1.8vw,18px);line-height:1.82;color:#D8D4E8}
.art-body h2{font-family:var(--display);font-weight:500;font-size:clamp(22px,3.2vw,30px);line-height:1.2;color:var(--paper);margin:46px 0 18px;letter-spacing:-.01em}
.art-body p{margin-bottom:22px}
.art-body strong{color:var(--paper);font-weight:700}
.art-body em{font-style:italic;color:rgba(244,238,226,.85)}

/* CTA */
.art-cta{margin:48px 0 0;padding:28px 32px;background:var(--glass);backdrop-filter:blur(14px);border-radius:18px;position:relative}
.art-cta::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(232,187,107,.6),rgba(125,230,255,.2),rgba(157,123,255,.5));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.art-cta-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.art-cta p{font-family:var(--display);font-style:italic;font-size:17px;color:var(--paper);font-weight:300;max-width:44ch}
.btn-buy{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(110deg,var(--gold),#F2D49B);color:var(--night);font-family:var(--tech);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:13px 22px;border-radius:100px;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(232,187,107,.5)}

/* tags */
.art-tags{margin-top:36px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--tech);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(125,230,255,.3);background:rgba(125,230,255,.06);padding:5px 12px;border-radius:100px}

/* share */
.share-row{margin-top:30px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.share-label{font-family:var(--tech);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.share-btn{font-family:var(--tech);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:100px;border:1px solid var(--line);color:var(--mist);background:transparent;cursor:pointer;transition:all .2s}
.share-btn:hover{border-color:var(--cyan);color:var(--cyan)}

/* nav between posts */
.post-nav{margin-top:60px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pnav-card{padding:20px;background:var(--glass);backdrop-filter:blur(12px);border-radius:14px;border:1px solid var(--line);transition:border-color .2s}
.pnav-card:hover{border-color:rgba(232,187,107,.4)}
.pnav-label{font-family:var(--tech);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);display:block;margin-bottom:8px}
.pnav-title{font-family:var(--display);font-weight:500;font-size:15px;line-height:1.3;color:var(--paper)}
.pnav-card.next{text-align:right}
@media(max-width:540px){.post-nav{grid-template-columns:1fr}}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:28px clamp(18px,4vw,60px);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--mist);font-size:13px}
footer a{color:var(--gold)}

.loading{color:var(--mist);text-align:center;padding:80px 20px}

.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;border:none;background:transparent}
.hamburger span{width:24px;height:2px;background:var(--paper);border-radius:2px;transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
@media(max-width:700px){
  .hamburger{display:flex}
  .nav-links{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(7,10,24,.97);backdrop-filter:blur(20px);flex-direction:column;align-items:center;justify-content:center;gap:32px;z-index:100}
  .nav-links.open{display:flex}
  .nav-links a{font-size:20px;letter-spacing:.2em}
  .nav-links .nav-amzn{padding:14px 28px;font-size:16px}
}
@media(max-width:480px){nav{padding:14px clamp(14px,3vw,28px)}.brand{font-size:17px}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<nav>
  <a class="brand" href="index.html">Vishal <em>Hingol</em></a>
  <button class="hamburger" id="hamburger" aria-label="Menu" onclick="toggleMenu()">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-links" id="navLinks">
    <a href="index.html">Home</a>
    <a href="store.html">Books</a>
    <a href="blog.html">Blog</a>
    <a class="nav-amzn" href="https://www.amazon.in/stores/Vishal-Hingol/author/B0H28TNG37" target="_blank" rel="noopener">Amazon ↗</a>
  </div>
</nav>

<div class="wrap" id="content"><p class="loading">Loading article…</p></div>

<footer>
  <span>© <span id="yr"></span> Vishal Hingol</span>
  <span><a href="blog.html">← All Articles</a> · <a href="store.html">Books</a></span>
</footer>

<script>
(async function(){
  document.getElementById('yr').textContent = new Date().getFullYear();
  const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');

  let data;
  try{
    const res = await fetch('blog.json?v='+Date.now(),{cache:'no-store'});
    data = await res.json();
  }catch(e){
    content.innerHTML='<p style="color:var(--mist);text-align:center;padding:80px 20px">Article unavailable — <a href="blog.html" style="color:var(--gold)">back to blog</a></p>';
    return;
  }

  let booksDB = {};
  try{
    const br = await fetch('books.json',{cache:'no-store'});
    const bd = await br.json();
    (bd.books||[]).forEach(b=>{ booksDB[b.id]=b; });
  }catch(e){}

  const posts = (data.posts||[]).slice().sort((a,b)=>new Date(b.published)-new Date(a.published));
  const idx = posts.findIndex(p=>p.id===id);

  if(idx===-1){
    content.innerHTML='<p style="color:var(--mist);text-align:center;padding:80px 20px">Article not found — <a href="blog.html" style="color:var(--gold)">back to blog</a></p>';
    return;
  }
  const post = posts[idx];

  // SEO meta
  document.getElementById('pageTitle').textContent = (post.seoTitle||post.title) + ' | Vishal Hingol';
  document.getElementById('pageDesc').content = post.seoDescription||post.excerpt;
  document.getElementById('ogTitle').content = post.seoTitle||post.title;
  document.getElementById('ogDesc').content = post.seoDescription||post.excerpt;

  // Schema.org Article
  const schema = {
    "@context":"https://schema.org",
    "@type":"Article",
    "headline": post.title,
    "description": post.seoDescription||post.excerpt,
    "datePublished": post.published,
    "author":{"@type":"Person","name":"Vishal Hingol","url":"https://vishalhingolauthor.com"},
    "publisher":{"@type":"Person","name":"Vishal Hingol"},
    "mainEntityOfPage":{"@type":"WebPage","@id":`https://vishalhingolauthor.com/article.html?id=${post.id}`}
  };
  const s=document.createElement('script'); s.type='application/ld+json'; s.text=JSON.stringify(schema);
  document.head.appendChild(s);

  // Simple markdown → HTML
  function md(text){
    return text
      .replace(/## (.+)/g,'<h2>$1</h2>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\n\n/g,'</p><p>')
      .replace(/^/,'<p>').replace(/$/,'</p>')
      .replace(/<p><h2>/g,'<h2>').replace(/<\/h2><\/p>/g,'</h2>')
      .replace(/<p><\/p>/g,'');
  }

  const fmtDate = d => new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});

  // Related book
  const book = post.relatedBook ? booksDB[post.relatedBook] : null;
  const bookCTA = book ? `
    <div class="art-cta">
      <div class="art-cta-inner">
        <p>Read the full exploration in <em>${esc(book.title)}</em> by Vishal Hingol</p>
        <a class="btn-buy" href="${esc(book.amazonUrl)}" target="_blank" rel="noopener">
          Get the Book ↗
        </a>
      </div>
    </div>` : '';

  // Prev / next
  const prev = posts[idx+1];
  const next = posts[idx-1];
  const postNav = `
    <div class="post-nav">
      ${prev ? `<a class="pnav-card" href="article.html?id=${esc(prev.id)}">
        <span class="pnav-label">← Previous</span>
        <div class="pnav-title">${esc(prev.title)}</div>
      </a>` : '<div></div>'}
      ${next ? `<a class="pnav-card next" href="article.html?id=${esc(next.id)}">
        <span class="pnav-label">Next →</span>
        <div class="pnav-title">${esc(next.title)}</div>
      </a>` : '<div></div>'}
    </div>`;

  content.innerHTML = `
    <div class="art-meta">
      <span class="art-cat">${esc(post.category)}</span>
      <h1>${esc(post.title)}</h1>
      <div class="art-byline">
        <span>By <strong>Vishal Hingol</strong></span>
        <span>${fmtDate(post.published)}</span>
        <span>${post.readingTime} min read</span>
      </div>
    </div>
    <div class="art-divider"></div>
    <div class="art-body">${md(post.content)}</div>
    ${bookCTA}
    <div class="art-tags">${(post.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="share-row">
      <span class="share-label">Share</span>
      <button class="share-btn" onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='Copied!').catch(()=>{})">Copy Link</button>
      <a class="share-btn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">Twitter / X</a>
      <a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener">LinkedIn</a>
    </div>
    ${postNav}`;
})();
</script>
</body>
</html>
