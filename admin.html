<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Vishal Hingol</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,300&family=Space+Grotesk:wght@400;500;600;700&family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#070A18;--night-2:#0B1026;--ink:#121A3E;--ink-2:#172052;
  --glass:rgba(18,26,62,.55);
  --line:rgba(244,238,226,.12);--gold:#E8BB6B;--cyan:#7DE6FF;--violet:#9D7BFF;--rose:#FF9ECF;
  --paper:#F4EEE2;--mist:#9AA1C7;--green:#7ED9A7;--red:#E88A8A;
  --display:'Fraunces',Georgia,serif;--body:'Albert Sans',system-ui,sans-serif;--tech:'Space Grotesk',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
::selection{background:var(--gold);color:var(--night)}

/* aurora layer */
.aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(110px);opacity:.45}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:55vw;height:55vw;left:-12%;top:-12%;background:radial-gradient(circle,rgba(157,123,255,.5),transparent 65%);animation:auro1 28s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:46vw;height:46vw;right:-10%;top:30%;background:radial-gradient(circle,rgba(125,230,255,.32),transparent 65%);animation:auro2 34s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:58vw;height:58vw;left:25%;bottom:-25%;background:radial-gradient(circle,rgba(232,187,107,.28),transparent 65%);animation:auro3 40s ease-in-out infinite alternate}
@keyframes auro1{to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes auro2{to{transform:translate(-8vw,10vh) scale(.9)}}
@keyframes auro3{to{transform:translate(-6vw,-9vh) scale(1.12)}}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.045;
  background:linear-gradient(rgba(244,238,226,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(244,238,226,.5) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 0%,transparent 75%);
}
header,.wrap,#toast{position:relative;z-index:1}

header{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding:22px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);
  background:rgba(7,10,24,.7);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20;
}
.brand{font-family:var(--display);font-size:20px;font-weight:500}
.brand em{font-style:italic;background:linear-gradient(100deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--tech);font-size:10px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan)}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.wrap{max-width:1080px;margin:0 auto;padding:clamp(22px,4vw,44px) clamp(18px,4vw,48px) 90px}

.card{
  position:relative;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:20px;padding:clamp(20px,3vw,32px);margin-bottom:24px;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(135deg,rgba(232,187,107,.5),rgba(125,230,255,.16) 40%,rgba(157,123,255,.4) 75%,rgba(232,187,107,.25));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.75;
}
.card h2{font-family:var(--display);font-weight:500;font-size:24px;margin-bottom:6px}
.card .hint{color:var(--mist);font-size:14px;margin-bottom:22px}

label{display:block;font-family:var(--tech);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:16px 0 7px}
input[type=text],input[type=date],input[type=url],textarea{
  width:100%;background:rgba(7,10,24,.7);border:1px solid var(--line);border-radius:12px;
  color:var(--paper);font-family:var(--body);font-size:15px;padding:13px 15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(125,230,255,.14),0 0 18px rgba(125,230,255,.12)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.row{grid-template-columns:1fr}}

.btn{
  display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;text-decoration:none;
  font-family:var(--tech);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 24px;border-radius:100px;transition:transform .2s,box-shadow .2s;
}
.btn-gold{background:linear-gradient(110deg,var(--gold),#F2D49B);color:var(--night)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(232,187,107,.4)}
.btn-ghost{background:rgba(125,230,255,.05);color:var(--cyan);border:1px solid rgba(125,230,255,.3)}
.btn-ghost:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(125,230,255,.2)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(232,138,138,.35)}
.btn-danger:hover{background:rgba(232,138,138,.1);box-shadow:0 0 18px rgba(232,138,138,.2)}
.btn-sm{padding:8px 14px;font-size:10px}

.connected-pill{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--tech);font-size:11px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--green);border:1px solid rgba(126,217,167,.35);
  background:rgba(126,217,167,.06);padding:7px 14px;border-radius:100px;
}
.connected-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:34px 0 18px}
.toolbar h2{font-family:var(--display);font-weight:500;font-size:28px}
.blist{display:flex;flex-direction:column;gap:14px}
.bitem{
  position:relative;display:grid;grid-template-columns:50px 1fr auto;gap:18px;align-items:center;
  background:var(--glass);backdrop-filter:blur(14px);border-radius:16px;padding:16px 18px;
}
@media(max-width:560px){.bitem{grid-template-columns:1fr;text-align:center}.bactions{justify-content:center}}
.bthumb{width:50px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.bthumb img{width:100%;height:100%;object-fit:cover}
.bthumb .gen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:9px;color:#fff}
.bmeta h3{font-family:var(--display);font-size:18px;font-weight:500}
.bmeta p{color:var(--mist);font-size:13px}
.bactions{display:flex;gap:8px}

#jsonOutput{font-family:var(--tech);background:#040610;color:var(--green);border:1px solid var(--line);padding:18px;border-radius:12px;width:100%;min-height:220px;font-size:13px}
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i></div>

<header>
  <div class="brand">Dashboard <em>— Vishal Hingol</em><small>Database Control</small></div>
  <div class="head-actions">
    <div class="connected-pill">Local Engine Connected</div>
  </div>
</header>

<div class="wrap">
  <!-- Author Profile Form -->
  <div class="card">
    <h2>Author Settings</h2>
    <p class="hint">Adjust the baseline author values stored inside your data directory file.</p>
    <div class="row">
      <div>
        <label>Author Name</label>
        <input type="text" id="authName" value="Vishal Hingol">
      </div>
      <div>
        <label>Amazon Author Page</label>
        <input type="url" id="authAmazon" value="https://amazon.in">
      </div>
    </div>
  </div>

  <!-- Book Editing / Entry Form -->
  <div class="card">
    <h2 id="formTitle">Add a New Book</h2>
    <p class="hint">Fill out the variables below. Click "Save Book to Array" to update the current environment cache matrix.</p>
    <input type="hidden" id="editIdx" value="">
    
    <div class="row">
      <div>
        <label>Unique Book ID (Kebab-case slug format)</label>
        <input type="text" id="bookId" placeholder="e.g. your-mind-is-the-blueprint">
      </div>
      <div>
        <label>Book Title</label>
        <input type="text" id="bookTitle" placeholder="e.g. Your Mind Is the Blueprint">
      </div>
    </div>

    <label>Subtitle / Hook Text</label>
    <input type="text" id="bookSubtitle" placeholder="Short hook text displayed immediately below the book title">

    <label>Description Paragraph</label>
    <textarea id="bookDesc" placeholder="Full descriptive promotional content paragraph explaining summary milestones..."></textarea>

    <div class="row">
      <div>
        <label>Tags (Comma separated values)</label>
        <input type="text" id="bookTags" placeholder="Self-Help, Mindset, Focus">
      </div>
      <div>
        <label>Amazon Retail Link URL</label>
        <input type="url" id="bookUrl" placeholder="https://amazon.com...">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Cover Image Path (Optional)</label>
        <input type="text" id="bookCover" placeholder="assets/covers/book-slug.png">
      </div>
      <div>
        <label>Publication Date</label>
        <input type="date" id="bookPublished">
      </div>
    </div>

    <div class="row" style="grid-template-columns:1fr">
      <div>
